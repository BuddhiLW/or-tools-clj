name: release

# Patch-bump, tag and publish to Clojars when a push changes the library.
# README, example and test-only commits do not mint a version, because a
# published pom is immutable.
# Secrets: CLOJARS_USERNAME, CLOJARS_DEPLOY_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'deps.edn'
      - 'version.edn'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      # Gate before the bump: a red suite must not mint a version.
      - name: Test
        run: clojure -M:test

      - name: Check the claims in the docs
        run: |
          set -euo pipefail
          clojure -T:build readme-examples
          clojure -T:build readme-examples :readme '"doc/reference.md"'
          clojure -T:build readme-examples :readme '"doc/examples.md"'

      # A version that never reached Clojars is released as it stands, so a run
      # that failed at Deploy can be retried without skipping a version number.
      - name: Check whether the current version is published
        id: current
        run: |
          set -euo pipefail
          VER=$(cat VERSION)
          POM="https://repo.clojars.org/io/github/buddhilw/or-tools-clj/$VER/or-tools-clj-$VER.pom"
          if curl -fsSI -o /dev/null "$POM"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        run: |
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"

      - name: Bump patch version
        if: steps.current.outputs.published == 'true'
        run: clojure -T:build bump :level :patch

      - name: Regenerate changelog
        if: steps.current.outputs.published == 'true'
        run: clojure -T:build changelog

      - name: Commit the new version
        if: steps.current.outputs.published == 'true'
        run: |
          set -euo pipefail
          git add VERSION CHANGELOG.md
          # [skip ci] stops this push from retriggering the workflow.
          git commit -m "chore(release): $(cat VERSION) [skip ci]"
          git push

      - name: Tag the version
        run: |
          set -euo pipefail
          VER=$(cat VERSION)
          if ! git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            git tag -a "v$VER" -m "release $VER"
            git push origin "v$VER"
          fi

      - name: Deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy
